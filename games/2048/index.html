<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>2048 — GridZone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #05050f;
  --bg2:       #080818;
  --grid-bg:   #0a0a1e;
  --cell-empty:#0d0d28;
  --border:    rgba(100,120,255,0.15);
  --t2:        #1a1a4e;   --t2c: #7080ff;
  --t4:        #1e1060;   --t4c: #a060ff;
  --t8:        #2a0a5e;   --t8c: #cc44ff;
  --t16:       #3d0a3d;   --t16c:#ff44cc;
  --t32:       #4a0a2a;   --t32c:#ff2266;
  --t64:       #5a0a10;   --t64c:#ff4400;
  --t128:      #4a2000;   --t128c:#ff8800;
  --t256:      #3a2800;   --t256c:#ffcc00;
  --t512:      #1a3000;   --t512c:#44ff88;
  --t1024:     #003030;   --t1024c:#00ffee;
  --t2048:     #001840;   --t2048c:#00aaff;
  --font-main: 'Orbitron', monospace;
  --font-body: 'Exo 2', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  background:var(--bg);
  color:#fff;
  font-family:var(--font-body);
  overflow-x:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* Background — animated plasma grid */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(80,40,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(0,200,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 60% 10%, rgba(255,40,180,0.05) 0%, transparent 50%);
  pointer-events:none;z-index:0;
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
  from{opacity:0.7;}to{opacity:1;}
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(80,80,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,80,255,0.03) 1px, transparent 1px);
  background-size:36px 36px;
  pointer-events:none;z-index:0;
}

/* Scanlines */
.scanlines{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}

.wrap{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 10px 30px;
}

/* ── HEADER ── */
header{
  width:100%;max-width:500px;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 4px 0;
}
.logo{
  font-family:var(--font-main);font-size:10px;font-weight:900;
  letter-spacing:.28em;color:#6080ff;
  text-shadow:0 0 14px #6080ff;text-decoration:none;
}
.back-btn{
  font-family:var(--font-main);font-size:9px;letter-spacing:.15em;
  color:#00eeff;border:1px solid rgba(0,238,255,.3);
  padding:6px 14px;border-radius:3px;background:none;cursor:pointer;
  text-shadow:0 0 8px #00eeff;transition:all .2s;
}
.back-btn:hover{background:rgba(0,238,255,.08);border-color:#00eeff;box-shadow:0 0 16px rgba(0,238,255,.25);}

/* ── TITLE ── */
.title-area{text-align:center;margin:14px 0 10px;}
.title-area h1{
  font-family:var(--font-main);
  font-size:clamp(36px,10vw,62px);font-weight:900;
  letter-spacing:.12em;
  background:linear-gradient(135deg,#a060ff 0%,#ff44cc 40%,#ff8800 70%,#ffcc00 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(180,60,255,0.5));
}
.title-area .sub{
  font-family:var(--font-main);font-size:10px;letter-spacing:.3em;
  color:rgba(160,96,255,.5);margin-top:4px;
}

/* ── SCORE ROW ── */
.score-row{
  display:flex;gap:10px;width:100%;max-width:500px;margin-bottom:12px;
}
.sbox{
  flex:1;background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;text-align:center;position:relative;overflow:hidden;
}
.sbox::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(100,80,255,0.06),transparent);
  pointer-events:none;
}
.sbox .lbl{font-size:8px;letter-spacing:.2em;color:rgba(255,255,255,.3);font-family:var(--font-main);margin-bottom:3px;}
.sbox .val{font-family:var(--font-main);font-size:clamp(16px,4vw,24px);font-weight:700;}
.sbox.score .val{color:#a060ff;text-shadow:0 0 12px #a060ff;}
.sbox.best  .val{color:#ffcc00;text-shadow:0 0 12px #ffcc00;}
.sbox.combo .val{color:#ff44cc;text-shadow:0 0 12px #ff44cc;}

/* score pop animation */
.pop{animation:popAnim .3s cubic-bezier(.17,.67,.3,1.4) forwards;}
@keyframes popAnim{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}

/* ── GRID ── */
.grid-outer{
  width:100%;max-width:500px;
  background:var(--grid-bg);
  border:1px solid rgba(100,80,255,0.2);
  border-radius:10px;
  padding:10px;
  box-shadow:
    0 0 0 1px rgba(100,80,255,0.08),
    0 0 40px rgba(100,80,255,0.1),
    0 0 80px rgba(100,80,255,0.05),
    inset 0 0 40px rgba(0,0,0,.5);
  position:relative;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  position:relative;
}

/* empty cells */
.cell-bg{
  aspect-ratio:1;
  background:var(--cell-empty);
  border-radius:6px;
  border:1px solid rgba(80,80,180,0.1);
}

/* tile layer — absolutely positioned over grid */
#tileLayer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
}

/* ── TILES ── */
.tile{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  font-family:var(--font-main);font-weight:900;
  transition:top .1s ease, left .1s ease;
  will-change:transform,top,left;
  overflow:hidden;
}
.tile::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 60%);
  border-radius:6px;pointer-events:none;
}
/* glow border */
.tile::after{
  content:'';position:absolute;inset:0;
  border-radius:6px;
  border:1px solid rgba(255,255,255,0.12);
}

.tile.new{animation:tileNew .2s cubic-bezier(.17,.67,.3,1.5) forwards;}
@keyframes tileNew{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}

.tile.merge{animation:tileMerge .25s cubic-bezier(.17,.67,.3,1.6) forwards;}
@keyframes tileMerge{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}

/* tile colours */
.t2   {background:var(--t2);   color:var(--t2c);   box-shadow:0 0 12px rgba(112,128,255,0.3);}
.t4   {background:var(--t4);   color:var(--t4c);   box-shadow:0 0 14px rgba(160,96,255,0.35);}
.t8   {background:var(--t8);   color:var(--t8c);   box-shadow:0 0 16px rgba(204,68,255,0.4);}
.t16  {background:var(--t16);  color:var(--t16c);  box-shadow:0 0 18px rgba(255,68,204,0.4);}
.t32  {background:var(--t32);  color:var(--t32c);  box-shadow:0 0 20px rgba(255,34,102,0.45);}
.t64  {background:var(--t64);  color:var(--t64c);  box-shadow:0 0 22px rgba(255,68,0,0.5);}
.t128 {background:var(--t128); color:var(--t128c); box-shadow:0 0 24px rgba(255,136,0,0.55);}
.t256 {background:var(--t256); color:var(--t256c); box-shadow:0 0 26px rgba(255,204,0,0.55);}
.t512 {background:var(--t512); color:var(--t512c); box-shadow:0 0 28px rgba(68,255,136,0.55);}
.t1024{background:var(--t1024);color:var(--t1024c);box-shadow:0 0 32px rgba(0,255,238,0.6);}
.t2048{background:var(--t2048);color:var(--t2048c);box-shadow:0 0 40px rgba(0,170,255,0.7);}
.thigh{background:linear-gradient(135deg,#001840,#002860);color:#fff;box-shadow:0 0 50px rgba(0,170,255,0.8);}

/* ── OVERLAY ── */
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,15,.9);border-radius:10px;
  gap:14px;z-index:50;transition:opacity .3s;
  backdrop-filter:blur(6px);
}
.overlay.hidden{opacity:0;pointer-events:none;}
.ov-title{
  font-family:var(--font-main);font-size:clamp(22px,6vw,36px);font-weight:900;
  letter-spacing:.2em;text-shadow:0 0 24px currentColor;
}
.ov-sub{
  font-family:var(--font-main);font-size:10px;letter-spacing:.15em;
  color:rgba(255,255,255,.4);text-align:center;line-height:1.8;padding:0 20px;
}
.ov-score{font-family:var(--font-main);font-size:13px;letter-spacing:.1em;color:#ffcc00;text-shadow:0 0 10px #ffcc00;}
.ov-btn{
  font-family:var(--font-main);font-size:11px;font-weight:700;letter-spacing:.2em;
  color:#05050f;background:linear-gradient(135deg,#a060ff,#ff44cc);
  border:none;padding:13px 36px;border-radius:4px;cursor:pointer;
  box-shadow:0 0 24px rgba(180,60,255,.6);transition:all .15s;margin-top:4px;
}
.ov-btn:hover{transform:scale(1.05);box-shadow:0 0 36px rgba(180,60,255,.9);}
.ov-btn:active{transform:scale(.97);}

/* ── CONTROLS BAR ── */
.controls{
  display:flex;gap:10px;width:100%;max-width:500px;margin-top:12px;
}
.ctrl-btn{
  flex:1;font-family:var(--font-main);font-size:9px;letter-spacing:.15em;
  color:rgba(255,255,255,.5);background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);border-radius:5px;
  padding:10px;cursor:pointer;transition:all .2s;
}
.ctrl-btn:hover{color:#fff;border-color:rgba(180,60,255,.5);background:rgba(180,60,255,.08);box-shadow:0 0 14px rgba(180,60,255,.2);}

/* ── MOBILE SWIPE HINT ── */
.hint{
  font-family:var(--font-main);font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.15);margin-top:12px;text-align:center;
}

/* ── FLOATING SCORE POP ── */
.score-float{
  position:fixed;
  font-family:var(--font-main);font-size:13px;font-weight:700;
  color:#ffcc00;text-shadow:0 0 12px #ffcc00;
  pointer-events:none;z-index:300;
  animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}

/* ── WIN SHIMMER on 2048 tile ── */
@keyframes shimmer{
  0%{background-position:200% center;}
  100%{background-position:-200% center;}
}
.t2048{
  background:linear-gradient(90deg,#001840,#00aaff,#00ffee,#a060ff,#001840);
  background-size:200% auto;
  animation:shimmer 2s linear infinite;
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="wrap">

  <header>
    <a class="logo" href="index.html">⬡ GRIDZONE</a>
    <button class="back-btn" onclick="window.location.href='index.html'">← ARCADE</button>
  </header>

  <div class="title-area">
    <h1>2048</h1>
    <div class="sub">// MERGE · EVOLVE · ASCEND //</div>
  </div>

  <div class="score-row">
    <div class="sbox score"><div class="lbl">SCORE</div><div class="val" id="scoreEl">0</div></div>
    <div class="sbox best"> <div class="lbl">BEST</div> <div class="val" id="bestEl">0</div></div>
    <div class="sbox combo"><div class="lbl">COMBO</div><div class="val" id="comboEl">×1</div></div>
  </div>

  <div class="grid-outer">
    <div class="grid" id="gridBg"></div>
    <div id="tileLayer"></div>
    <div class="overlay" id="overlay">
      <div class="ov-title" id="ovTitle" style="color:#a060ff">2048</div>
      <div class="ov-sub" id="ovSub">Merge tiles to reach<br/><span style="color:#ffcc00;font-size:14px;">2048</span><br/>and beyond.</div>
      <div class="ov-score" id="ovScore" style="display:none"></div>
      <button class="ov-btn" id="ovBtn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="newGame()">NEW GAME</button>
    <button class="ctrl-btn" onclick="undoMove()">↩ UNDO</button>
  </div>

  <div class="hint" id="hint">
    <span id="hintText">ARROW KEYS / WASD / SWIPE TO MERGE</span>
  </div>
</div>

<script>
// ── STATE ──
let board, score, best, combo, comboTimer, prevBoard, prevScore, gameActive, won;
const SIZE = 4;

// ── AUDIO ──
let AC = null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(freq,type,dur,vol=0.18){
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
function soundMerge(val){
  const freqs={2:220,4:277,8:330,16:415,32:523,64:659,128:784,256:987,512:1175,1024:1480,2048:1760};
  const f=freqs[val]||1760;
  beep(f,'square',.08,.15);
  setTimeout(()=>beep(f*1.5,'sine',.06,.1),40);
}
function soundSlide(){beep(180,'sine',.04,.06);}
function soundGameOver(){[200,170,140,110,80].forEach((f,i)=>setTimeout(()=>beep(f,'sawtooth',.12,.2),i*70));}
function soundWin(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,'square',.12,.22),i*80));}

// ── INIT ──
function emptyBoard(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0));}
function copyBoard(b){return b.map(r=>[...r]);}

function startGame(){
  document.getElementById('overlay').classList.add('hidden');
  newGame();
}

function newGame(){
  best = +localStorage.getItem('gz_2048_best')||0;
  document.getElementById('bestEl').textContent=best;
  board = emptyBoard();
  score = 0; combo = 1; won = false; gameActive = true;
  prevBoard = null; prevScore = 0;
  updateScoreEl();
  addTile(); addTile();
  renderAll();
}

// ── TILE LOGIC ──
function emptyCells(){
  const cells=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!board[r][c]) cells.push([r,c]);
  return cells;
}

function addTile(isNew=true){
  const cells=emptyCells();
  if(!cells.length) return null;
  const [r,c]=cells[Math.floor(Math.random()*cells.length)];
  board[r][c]=Math.random()<0.9?2:4;
  return {r,c,val:board[r][c],isNew};
}

// ── MOVE ──
function move(dir){
  if(!gameActive) return;
  prevBoard=copyBoard(board); prevScore=score;

  let moved=false, mergeCount=0;
  const newTiles=[];

  // Rotate board so we always merge LEFT
  let b=copyBoard(board);
  if(dir==='up')    b=rotateCCW(b);
  if(dir==='down')  b=rotateCW(b);
  if(dir==='right') b=rotate180(b);

  for(let r=0;r<SIZE;r++){
    const row=b[r].filter(v=>v);
    const merged=[];
    let i=0;
    while(i<row.length){
      if(i+1<row.length && row[i]===row[i+1]){
        const val=row[i]*2;
        merged.push(val);
        const pts=val*combo;
        score+=pts;
        mergeCount++;
        soundMerge(val);
        floatScore('+'+pts);
        newTiles.push({val,merged:true});
        i+=2;
      } else {
        merged.push(row[i]);
        newTiles.push({val:row[i],merged:false});
        i++;
      }
    }
    while(merged.length<SIZE) merged.push(0);
    if(b[r].join()!==merged.join()) moved=true;
    b[r]=merged;
  }

  if(dir==='up')    b=rotateCW(b);
  if(dir==='down')  b=rotateCCW(b);
  if(dir==='right') b=rotate180(b);

  if(!moved){combo=1;updateCombo();return;}
  soundSlide();
  board=b;

  // Combo system
  if(mergeCount>0){
    combo=Math.min(combo+mergeCount-1,8);
    clearTimeout(comboTimer);
    comboTimer=setTimeout(()=>{combo=1;updateCombo();},2200);
  } else { combo=Math.max(combo-1,1); }
  updateCombo();

  if(score>best){best=score;localStorage.setItem('gz_2048_best',best);}
  updateScoreEl();

  const added=addTile(true);
  renderAll(added);

  if(checkWin() && !won){ won=true; setTimeout(showWin,400); }
  else if(checkLose()){ gameActive=false; setTimeout(showGameOver,400); }
}

// Rotations
function rotateCW(b){return b[0].map((_,i)=>b.map(r=>r[i]).reverse());}
function rotateCCW(b){return b[0].map((_,i)=>b.map(r=>r[i])).reverse();}
function rotate180(b){return b.map(r=>[...r].reverse()).reverse();}

function checkWin(){return board.some(r=>r.some(v=>v>=2048));}
function checkLose(){
  if(emptyCells().length) return false;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const v=board[r][c];
    if(c<SIZE-1&&board[r][c+1]===v) return false;
    if(r<SIZE-1&&board[r+1][c]===v) return false;
  }
  return true;
}

function undoMove(){
  if(!prevBoard) return;
  board=copyBoard(prevBoard); score=prevScore;
  prevBoard=null;
  updateScoreEl(); renderAll();
}

// ── RENDER ──
function tileClass(val){
  if(val<=2048) return 't'+val;
  return 'thigh';
}

function fontSize(val){
  if(val<100)  return 'clamp(20px,5vw,32px)';
  if(val<1000) return 'clamp(16px,4vw,26px)';
  if(val<10000) return 'clamp(12px,3vw,20px)';
  return 'clamp(10px,2.5vw,16px)';
}

let cellPositions=[];

function buildGrid(){
  const gb=document.getElementById('gridBg');
  gb.innerHTML='';
  for(let i=0;i<SIZE*SIZE;i++){
    const d=document.createElement('div');
    d.className='cell-bg';
    gb.appendChild(d);
  }
  // measure after paint
  requestAnimationFrame(()=>{
    cellPositions=[];
    const cells=gb.querySelectorAll('.cell-bg');
    const gbRect=gb.getBoundingClientRect();
    cells.forEach(cell=>{
      const r=cell.getBoundingClientRect();
      cellPositions.push({
        top:r.top-gbRect.top,
        left:r.left-gbRect.left,
        w:r.width, h:r.height
      });
    });
  });
}

let tileEls={};

function renderAll(newAdded=null){
  const layer=document.getElementById('tileLayer');
  const gb=document.getElementById('gridBg');
  const gbRect=gb.getBoundingClientRect();
  const layerRect=layer.getBoundingClientRect();
  const offsetTop=gbRect.top-layerRect.top;
  const offsetLeft=gbRect.left-layerRect.left;

  // Remove tiles no longer on board
  const existing=new Set();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]) existing.add(r+'-'+c);
  Object.keys(tileEls).forEach(k=>{
    if(!existing.has(k)){tileEls[k].remove();delete tileEls[k];}
  });

  const cells=gb.querySelectorAll('.cell-bg');

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const val=board[r][c];
      if(!val) continue;
      const idx=r*SIZE+c;
      const cell=cells[idx];
      const cRect=cell.getBoundingClientRect();
      const top=cRect.top-layerRect.top;
      const left=cRect.left-layerRect.left;
      const w=cRect.width, h=cRect.height;
      const key=r+'-'+c;

      let el=tileEls[key];
      const isNew=(newAdded && newAdded.r===r && newAdded.c===c);

      if(!el){
        el=document.createElement('div');
        el.className='tile '+tileClass(val)+(isNew?' new':'');
        el.style.width=w+'px';el.style.height=h+'px';
        el.style.fontSize=fontSize(val);
        el.style.top=top+'px';el.style.left=left+'px';
        el.textContent=val;
        layer.appendChild(el);
        tileEls[key]=el;
      } else {
        // update position (CSS transition handles slide)
        el.style.top=top+'px';
        el.style.left=left+'px';
        // update class if value changed
        if(el.textContent!=val){
          el.textContent=val;
          el.className='tile '+tileClass(val)+' merge';
          el.style.fontSize=fontSize(val);
          setTimeout(()=>el.classList.remove('merge'),300);
        }
      }
    }
  }
}

// ── SCORE UI ──
function updateScoreEl(){
  const el=document.getElementById('scoreEl');
  el.textContent=score;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  document.getElementById('bestEl').textContent=best;
}
function updateCombo(){
  document.getElementById('comboEl').textContent='×'+combo;
}

function floatScore(txt){
  const el=document.createElement('div');
  el.className='score-float';
  el.textContent=txt;
  const go=document.getElementById('grid-outer')||document.querySelector('.grid-outer');
  const rect=(go||document.body).getBoundingClientRect();
  el.style.left=(rect.left+rect.width/2-20)+'px';
  el.style.top=(rect.top+rect.height/3)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ── OVERLAYS ──
function showWin(){
  soundWin();
  const ov=document.getElementById('overlay');
  document.getElementById('ovTitle').textContent='2048!';
  document.getElementById('ovTitle').style.color='#00aaff';
  document.getElementById('ovSub').innerHTML='You reached 2048!<br/><span style="color:rgba(255,255,255,.4);font-size:10px;">Keep going or start over.</span>';
  document.getElementById('ovScore').style.display='block';
  document.getElementById('ovScore').textContent='SCORE: '+score;
  document.getElementById('ovBtn').textContent='KEEP GOING';
  document.getElementById('ovBtn').onclick=()=>{ov.classList.add('hidden');gameActive=true;};
  ov.classList.remove('hidden');
}
function showGameOver(){
  soundGameOver();
  const ov=document.getElementById('overlay');
  document.getElementById('ovTitle').textContent='GAME OVER';
  document.getElementById('ovTitle').style.color='#ff2266';
  document.getElementById('ovSub').innerHTML=score>=best?'🏆 New Best Score!':'No more moves.';
  document.getElementById('ovScore').style.display='block';
  document.getElementById('ovScore').textContent='SCORE: '+score+' · BEST: '+best;
  document.getElementById('ovBtn').textContent='TRY AGAIN';
  document.getElementById('ovBtn').onclick=startGame;
  ov.classList.remove('hidden');
}

// ── INPUT ──
document.addEventListener('keydown',e=>{
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
             w:'up',s:'down',a:'left',d:'right',
             W:'up',S:'down',A:'left',D:'right'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

let tx=null,ty=null;
document.querySelector('.grid-outer').addEventListener('touchstart',e=>{
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
document.querySelector('.grid-outer').addEventListener('touchend',e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  tx=ty=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

// ── BOOT ──
best=+localStorage.getItem('gz_2048_best')||0;
document.getElementById('bestEl').textContent=best;
buildGrid();
</script>
