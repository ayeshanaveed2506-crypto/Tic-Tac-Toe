<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake — GridZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #1a0a2e;
    --bg2:   #231040;
    --bg3:   #2c1654;
    --neon-yellow: #f9e94e;
    --neon-pink:   #ff4fa3;
    --neon-cyan:   #3ff5d4;
    --neon-green:  #6dff6d;
    --neon-orange: #ff7c2a;
    --text:  #f0e8ff;
    --muted: #9b87c0;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(180,130,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,130,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  #laser-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.45; }
  #particle-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  nav {
    position: relative; z-index: 10; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2.5rem;
    border-bottom: 1px solid rgba(180,130,255,0.18);
    background: rgba(26,10,46,0.75); backdrop-filter: blur(8px);
  }
  .logo { font-family: 'Boogaloo', cursive; font-size: 1.7rem; color: var(--neon-yellow); text-shadow: 0 0 20px rgba(249,233,78,0.5); text-decoration: none; }
  .logo span { color: var(--neon-pink); }
  .back-link { font-size: 0.82rem; font-weight: 700; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  .back-link:hover { color: var(--neon-cyan); }

  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.5rem 1rem 2rem; width: 100%; max-width: 520px;
  }

  .game-title {
    font-family: 'Boogaloo', cursive; font-size: 2.4rem; color: var(--text);
    text-shadow: 0 0 30px rgba(109,255,109,0.4); margin-bottom: 0.1rem; text-align: center;
  }
  .game-subtitle { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem; }

  /* top bar */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; margin-bottom: 0.8rem; gap: 8px; flex-wrap: wrap;
  }

  .diff-toggle {
    display: flex; background: var(--bg2);
    border: 1px solid rgba(180,130,255,0.2); border-radius: 50px;
    padding: 3px; gap: 3px;
  }
  .diff-btn {
    font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 700;
    padding: 6px 14px; border-radius: 50px; border: none;
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .diff-btn.active { background: var(--neon-green); color: var(--bg); box-shadow: 0 0 12px rgba(109,255,109,0.4); }

  .score-wrap { display: flex; gap: 10px; }
  .score-box {
    background: var(--bg2); border: 1px solid rgba(180,130,255,0.15);
    border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 64px;
  }
  .score-box .slabel { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .score-box .sval { font-family: 'Boogaloo', cursive; font-size: 1.3rem; color: var(--neon-yellow); text-shadow: 0 0 10px rgba(249,233,78,0.5); }
  .score-box.best .sval { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(63,245,212,0.5); }

  /* canvas wrap */
  .canvas-wrap {
    position: relative; width: 100%;
    max-width: 400px; aspect-ratio: 1;
    margin-bottom: 1rem;
  }
  #game-canvas {
    width: 100%; height: 100%; display: block;
    border-radius: 16px;
    border: 1.5px solid rgba(109,255,109,0.25);
    box-shadow: 0 0 30px rgba(109,255,109,0.1), 0 0 60px rgba(109,255,109,0.05);
  }

  /* overlay */
  .overlay {
    position: absolute; inset: 0; border-radius: 16px;
    background: rgba(26,10,46,0.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; z-index: 5; backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .overlay-title { font-family: 'Boogaloo', cursive; font-size: 2rem; color: var(--neon-yellow); text-shadow: 0 0 20px rgba(249,233,78,0.5); }
  .overlay-sub { font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.6; }
  .overlay-score { font-family: 'Boogaloo', cursive; font-size: 1.4rem; color: var(--neon-green); text-shadow: 0 0 14px rgba(109,255,109,0.6); }
  .play-btn {
    font-family: 'Boogaloo', cursive; font-size: 1.1rem; letter-spacing: 0.04em;
    padding: 11px 36px; border-radius: 50px;
    background: var(--neon-green); color: var(--bg);
    border: none; cursor: pointer; transition: all 0.15s; margin-top: 4px;
    box-shadow: 0 0 20px rgba(109,255,109,0.35);
  }
  .play-btn:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(109,255,109,0.55); }

  /* sound toggle */
  .sound-row { display: flex; align-items: center; gap: 12px; margin-bottom: 0.8rem; }
  .sound-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .sound-pill {
    width: 38px; height: 20px; background: var(--bg3);
    border-radius: 50px; border: 1px solid rgba(180,130,255,0.25); position: relative; transition: background 0.2s;
  }
  .sound-pill::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: all 0.2s;
  }
  .sound-toggle.on .sound-pill { background: rgba(63,245,212,0.2); border-color: var(--neon-cyan); }
  .sound-toggle.on .sound-pill::after { left: 21px; background: var(--neon-cyan); box-shadow: 0 0 7px var(--neon-cyan); }
  .sound-label { font-size: 0.75rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .sound-toggle.on .sound-label { color: var(--neon-cyan); }

  /* D-pad */
  .dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px; width: 160px; margin-bottom: 1rem;
  }
  .dpad-btn {
    font-size: 1.2rem; padding: 0;
    width: 48px; height: 48px;
    background: var(--bg2); border: 1.5px solid rgba(180,130,255,0.2);
    border-radius: 10px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: var(--bg3); border-color: var(--neon-green);
    box-shadow: 0 0 12px rgba(109,255,109,0.35);
  }
  .dpad-up    { grid-area: up; justify-self: center; }
  .dpad-left  { grid-area: left; justify-self: end; }
  .dpad-right { grid-area: right; justify-self: start; }
  .dpad-down  { grid-area: down; justify-self: center; }

  footer {
    position: relative; z-index: 1; margin-top: auto; padding: 1.25rem;
    text-align: center; font-size: 0.78rem; color: var(--muted);
    border-top: 1px solid rgba(180,130,255,0.1); width: 100%;
    background: rgba(26,10,46,0.6); backdrop-filter: blur(4px);
  }
  footer a { color: var(--neon-pink); text-decoration: none; }

  @media (max-width: 400px) { nav { padding: 1rem 1.25rem; } }
</style>

<nav>

<main>
  <h1 class="game-title">🐍 Snake</h1>
  <p class="game-subtitle">Eat · Grow · Survive</p>

  <div class="top-bar">
    <div class="diff-toggle">
      <button class="diff-btn" id="d-easy"   onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn active" id="d-medium" onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn" id="d-hard"   onclick="setDiff('hard')">Hard</button>
    </div>
    <div class="score-wrap">
      <div class="score-box">
        <div class="slabel">Score</div>
        <div class="sval" id="score-display">0</div>
      </div>
      <div class="score-box best">
        <div class="slabel">Best</div>
        <div class="sval" id="best-display">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title">🐍 Snake</div>
      <div class="overlay-sub" id="overlay-sub">Arrow keys or D-pad to move<br>Eat food, don't hit walls or yourself!</div>
      <div class="overlay-score hidden" id="overlay-score"></div>
      <button class="play-btn" id="play-btn" onclick="startGame()">▶ Play</button>
    </div>
  </div>

  <div class="sound-row">
    <div class="sound-toggle on" id="soundToggle" onclick="toggleSound()">
      <div class="sound-pill"></div>
      <span class="sound-label">🔊 Sound</span>
    </div>
  </div>

  <div class="dpad">
    <button class="dpad-btn dpad-up"    id="btn-up"    ontouchstart="dpadPress('UP')"    onclick="dpadPress('UP')">▲</button>
    <button class="dpad-btn dpad-left"  id="btn-left"  ontouchstart="dpadPress('LEFT')"  onclick="dpadPress('LEFT')">◀</button>
    <button class="dpad-btn dpad-right" id="btn-right" ontouchstart="dpadPress('RIGHT')" onclick="dpadPress('RIGHT')">▶</button>
    <button class="dpad-btn dpad-down"  id="btn-down"  ontouchstart="dpadPress('DOWN')"  onclick="dpadPress('DOWN')">▼</button>
  </div>
</main>

<footer>
  <p>Part of <a href="index.html">GridZone</a> · Free games forever · <a href="https://ko-fi.com" target="_blank">Support us ☕</a></p>
</footer>

<script>
// ===================== LASER BACKGROUND =====================
const bgCanvas = document.getElementById('laser-bg');
const bgCtx = bgCanvas.getContext('2d');
let BW, BH;
function resizeBg() { BW = bgCanvas.width = window.innerWidth; BH = bgCanvas.height = window.innerHeight; }
resizeBg(); window.addEventListener('resize', resizeBg);
const LCOLORS = ['rgba(109,255,109,','rgba(255,79,163,','rgba(63,245,212,','rgba(249,233,78,','rgba(180,100,255,'];
const lasers = Array.from({length:6},(_,i)=>({
  orbitCX: Math.random()*window.innerWidth, orbitCY: Math.random()*window.innerHeight,
  orbitR: 100+Math.random()*220, orbitAngle: Math.random()*Math.PI*2,
  orbitSpeed: (Math.random()-0.5)*0.007,
  angle: Math.random()*Math.PI*2, speed: 0.003+Math.random()*0.004,
  length: 160+Math.random()*260, color: LCOLORS[i%LCOLORS.length],
  alpha: 0.15+Math.random()*0.2, width: 1+Math.random()*1.5,
}));
function drawBg() {
  bgCtx.clearRect(0,0,BW,BH);
  lasers.forEach(l=>{
    l.orbitAngle+=l.orbitSpeed; l.angle+=l.speed;
    const x=l.orbitCX+Math.cos(l.orbitAngle)*l.orbitR;
    const y=l.orbitCY+Math.sin(l.orbitAngle)*l.orbitR;
    const dx=Math.cos(l.angle)*l.length, dy=Math.sin(l.angle)*l.length;
    const g=bgCtx.createLinearGradient(x,y,x+dx,y+dy);
    g.addColorStop(0,l.color+'0)'); g.addColorStop(0.4,l.color+l.alpha+')');
    g.addColorStop(0.6,l.color+l.alpha+')'); g.addColorStop(1,l.color+'0)');
    bgCtx.beginPath(); bgCtx.moveTo(x,y); bgCtx.lineTo(x+dx,y+dy);
    bgCtx.strokeStyle=g; bgCtx.lineWidth=l.width;
    bgCtx.shadowColor=l.color+'0.7)'; bgCtx.shadowBlur=8; bgCtx.stroke(); bgCtx.shadowBlur=0;
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// ===================== PARTICLES =====================
const pCanvas=document.getElementById('particle-canvas');
const pCtx=pCanvas.getContext('2d');
function resizeP(){pCanvas.width=window.innerWidth;pCanvas.height=window.innerHeight;}
resizeP(); window.addEventListener('resize',resizeP);
let particles=[], pRunning=false;
function spawnParticles(x,y,color,count=22){
  for(let i=0;i<count;i++){
    const a=(Math.PI*2/count)*i+Math.random()*0.4;
    const s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:1,size:1.5+Math.random()*2.5,color,decay:0.028+Math.random()*0.02,laser:Math.random()>0.5});
  }
  if(!pRunning){pRunning=true;animP();}
}
function animP(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles=particles.filter(p=>p.alpha>0.02);
  if(!particles.length){pRunning=false;return;}
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.alpha-=p.decay;
    pCtx.globalAlpha=p.alpha;
    if(p.laser){
      const g=pCtx.createLinearGradient(p.x,p.y,p.x-p.vx*3,p.y-p.vy*3);
      g.addColorStop(0,p.color);g.addColorStop(1,'transparent');
      pCtx.beginPath();pCtx.moveTo(p.x,p.y);pCtx.lineTo(p.x-p.vx*3,p.y-p.vy*3);
      pCtx.strokeStyle=g;pCtx.lineWidth=p.size*0.7;
      pCtx.shadowColor=p.color;pCtx.shadowBlur=5;pCtx.stroke();pCtx.shadowBlur=0;
    } else {
      pCtx.beginPath();pCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
      pCtx.fillStyle=p.color;pCtx.shadowColor=p.color;pCtx.shadowBlur=7;pCtx.fill();pCtx.shadowBlur=0;
    }
  });
  pCtx.globalAlpha=1;
  requestAnimationFrame(animP);
}

// ===================== AUDIO =====================
const AC=new(window.AudioContext||window.webkitAudioContext)();
let soundOn=true;
function playTone(freq,type,dur,vol=0.25,delay=0){
  if(!soundOn)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime+delay);
    g.gain.setValueAtTime(vol,AC.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
    o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur);
  }catch(e){}
}
function sfxEat()  { playTone(660,'sine',0.08,0.2); playTone(880,'sine',0.06,0.12,0.06); }
function sfxDie()  { playTone(300,'sawtooth',0.1,0.2); playTone(200,'sawtooth',0.15,0.2,0.1); playTone(150,'sawtooth',0.2,0.15,0.25); }
function sfxMove() { playTone(180,'sine',0.04,0.06); }
function sfxStart(){ [523,659,784].forEach((f,i)=>playTone(f,'sine',0.12,0.2,i*0.08)); }
function resumeAC(){ if(AC.state==='suspended')AC.resume(); }
function toggleSound(){
  resumeAC(); soundOn=!soundOn;
  const el=document.getElementById('soundToggle');
  el.className='sound-toggle'+(soundOn?' on':'');
  el.querySelector('.sound-label').textContent=soundOn?'🔊 Sound':'🔇 Sound';
}

// ===================== GAME =====================
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const GRID=20, COLS=20, ROWS=20;
const CELL=canvas.width/COLS;

const SPEEDS={ easy:160, medium:110, hard:68 };
const SPEED_BONUS={ easy:3, medium:2, hard:1 }; // ms faster per food eaten
const MIN_SPEED=55;

let snake, dir, nextDir, food, score, bestScore=0, gameLoop, diff='medium', running=false, speed;

function setDiff(d){
  resumeAC();
  diff=d;
  ['easy','medium','hard'].forEach(x=>{
    document.getElementById('d-'+x).className='diff-btn'+(x===d?' active':'');
  });
  if(running){ clearInterval(gameLoop); startGame(); }
}

function startGame(){
  resumeAC(); sfxStart();
  document.getElementById('overlay').classList.add('hidden');
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; speed=SPEEDS[diff];
  updateScoreDisplay();
  placeFood();
  running=true;
  clearInterval(gameLoop);
  gameLoop=setInterval(tick, speed);
  draw();
}

function placeFood(){
  let pos;
  do { pos={x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}

function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};

  // wall collision
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){ gameOver(); return; }
  // self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){ gameOver(); return; }

  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    sfxEat();
    // particle burst at food position on canvas
    const cr=canvas.getBoundingClientRect();
    const fx=cr.left+(food.x+0.5)*cr.width/COLS;
    const fy=cr.top+(food.y+0.5)*cr.height/ROWS;
    spawnParticles(fx,fy,'#6dff6d',18);
    updateScoreDisplay();
    placeFood();
    // speed up progressively
    speed=Math.max(MIN_SPEED, speed-SPEED_BONUS[diff]);
    clearInterval(gameLoop);
    gameLoop=setInterval(tick, speed);
  } else {
    snake.pop();
  }
  draw();
}

function draw(){
  // background
  ctx.fillStyle='#1a0a2e';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // subtle grid
  ctx.strokeStyle='rgba(180,130,255,0.07)';
  ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){
    ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
  }
  for(let j=0;j<=ROWS;j++){
    ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(canvas.width,j*CELL);ctx.stroke();
  }

  // food — glowing pulsing dot
  const pulse=0.7+0.3*Math.sin(Date.now()*0.006);
  const fx=(food.x+0.5)*CELL, fy=(food.y+0.5)*CELL, fr=CELL*0.38*pulse;
  ctx.save();
  ctx.shadowColor='#ff4fa3'; ctx.shadowBlur=18*pulse;
  ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2);
  const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
  fg.addColorStop(0,'#fff'); fg.addColorStop(0.4,'#ff8fd4'); fg.addColorStop(1,'#ff4fa3');
  ctx.fillStyle=fg; ctx.fill();
  ctx.restore();

  // snake
  snake.forEach((seg,i)=>{
    const sx=seg.x*CELL+1, sy=seg.y*CELL+1, sw=CELL-2, sh=CELL-2;
    const t=i/snake.length;
    // gradient from bright green head to darker tail
    const r=Math.round(30+t*20), g=Math.round(255-t*120), b=Math.round(80+t*50);
    const segColor=`rgb(${r},${g},${b})`;

    ctx.save();
    if(i===0){
      // head glow
      ctx.shadowColor='#6dff6d'; ctx.shadowBlur=16;
    } else {
      ctx.shadowColor='rgba(109,255,109,0.4)'; ctx.shadowBlur=6;
    }
    ctx.fillStyle=segColor;
    const radius=i===0?6:4;
    ctx.beginPath();
    ctx.roundRect(sx,sy,sw,sh,radius);
    ctx.fill();

    // laser edge shimmer on head
    if(i===0){
      ctx.strokeStyle='rgba(255,255,255,0.4)';
      ctx.lineWidth=1;
      ctx.stroke();
    }
    ctx.restore();
  });

  // eyes on head
  if(snake.length){
    const h=snake[0];
    const hx=h.x*CELL, hy=h.y*CELL;
    ctx.fillStyle='#1a0a2e';
    const ex1={x:hx+CELL*0.3,y:hy+CELL*0.3}, ex2={x:hx+CELL*0.65,y:hy+CELL*0.3};
    if(dir.y!==0){ ex1.x=hx+CELL*0.28; ex1.y=dir.y>0?hy+CELL*0.55:hy+CELL*0.25; ex2.x=hx+CELL*0.65; ex2.y=ex1.y; }
    ctx.beginPath(); ctx.arc(ex1.x,ex1.y,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2.x,ex2.y,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#6dff6d';
    ctx.beginPath(); ctx.arc(ex1.x,ex1.y,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2.x,ex2.y,1,0,Math.PI*2); ctx.fill();
  }
}

function gameOver(){
  sfxDie();
  running=false;
  clearInterval(gameLoop);
  // burst on head
  const cr=canvas.getBoundingClientRect();
  const hx=cr.left+(snake[0].x+0.5)*cr.width/COLS;
  const hy=cr.top+(snake[0].y+0.5)*cr.height/ROWS;
  spawnParticles(hx,hy,'#ff4fa3',30);

  if(score>bestScore){ bestScore=score; document.getElementById('best-display').textContent=bestScore; }

  const overlay=document.getElementById('overlay');
  document.getElementById('overlay-title').textContent='💀 Game Over';
  document.getElementById('overlay-sub').textContent='';
  const osEl=document.getElementById('overlay-score');
  osEl.textContent='Score: '+score+(score>bestScore-1&&score>0?' 🏆 New Best!':'');
  osEl.classList.remove('hidden');
  document.getElementById('play-btn').textContent='↺ Play Again';
  overlay.classList.remove('hidden');
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=score;
  document.getElementById('best-display').textContent=bestScore;
}

// ===================== CONTROLS =====================
const KEY_MAP={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',
               w:'UP',s:'DOWN',a:'LEFT',d:'RIGHT',W:'UP',S:'DOWN',A:'LEFT',D:'RIGHT'};
const DIR_MAP={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
const OPPOSITE={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};

function changeDir(d){
  if(!running)return;
  const nd=DIR_MAP[d];
  const curOpp=OPPOSITE[Object.keys(DIR_MAP).find(k=>DIR_MAP[k].x===dir.x&&DIR_MAP[k].y===dir.y)||'UP'];
  if(d!==curOpp) nextDir=nd;
  sfxMove();
}

document.addEventListener('keydown',e=>{
  resumeAC();
  const d=KEY_MAP[e.key];
  if(d){ e.preventDefault(); changeDir(d); }
  if(e.key===' '&&!running){ startGame(); }
});

function dpadPress(d){
  resumeAC();
  changeDir(d);
  const btnMap={UP:'btn-up',DOWN:'btn-down',LEFT:'btn-left',RIGHT:'btn-right'};
  const btn=document.getElementById(btnMap[d]);
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'),120);
}

// touch swipe on canvas
let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)){changeDir(dx>0?'RIGHT':'LEFT');}
  else{changeDir(dy>0?'DOWN':'UP');}
},{passive:true});

// initial draw
draw();
</script>
