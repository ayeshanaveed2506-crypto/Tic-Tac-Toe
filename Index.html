<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #1a1a1f;
    --border: #2e2e38;
    --x-color: #a78bfa;
    --o-color: #34d399;
    --text: #f0f0f4;
    --muted: #6b6b80;
    --win-bg: #1e1b2e;
    --accent: #a78bfa;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.25rem;
  }

  .tagline {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.75rem;
  }

  .mode-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .mode-btn.active {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
  }

  .mode-btn:hover:not(.active) {
    border-color: #444;
    color: var(--text);
  }

  .status {
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 1.5rem;
    min-height: 1.4em;
    text-align: center;
  }

  .status .marker-x { color: var(--x-color); }
  .status .marker-o { color: var(--o-color); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 1.75rem;
  }

  .cell {
    width: clamp(80px, 22vw, 108px);
    height: clamp(80px, 22vw, 108px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: clamp(2rem, 7vw, 2.8rem);
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    color: var(--text);
    user-select: none;
  }

  .cell:hover:not(.taken) {
    background: #22222a;
    border-color: #444;
    transform: scale(1.03);
  }

  .cell.x { color: var(--x-color); }
  .cell.o { color: var(--o-color); }

  .cell.win {
    background: var(--win-bg);
    border-color: var(--accent);
  }

  .cell.win.o { border-color: var(--o-color); }

  .cell.pop {
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0.4; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .scores {
    display: flex;
    gap: 20px;
    margin-bottom: 1.5rem;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--text);
    min-width: 2ch;
    text-align: center;
  }

  .score-item.x .score-value { color: var(--x-color); }
  .score-item.o .score-value { color: var(--o-color); }

  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 24px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .reset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: 3rem;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

<h1>Tic&#8209;Tac&#8209;Toe</h1>
<p class="tagline">Classic · Timeless · Free</p>

<div class="mode-row">
  <button class="mode-btn active" id="btn-2p" onclick="setMode('2p')">2 Players</button>
  <button class="mode-btn" id="btn-ai" onclick="setMode('ai')">vs AI</button>
</div>

<div class="status" id="status"><span class="marker-x">X</span> goes first</div>

<div class="board" id="board"></div>

<div class="scores">
  <div class="score-item x">
    <span class="score-label">X wins</span>
    <span class="score-value" id="sx">0</span>
  </div>
  <div class="score-item">
    <span class="score-label">Draws</span>
    <span class="score-value" id="sd">0</span>
  </div>
  <div class="score-item o">
    <span class="score-label">O wins</span>
    <span class="score-value" id="so">0</span>
  </div>
</div>

<button class="reset-btn" onclick="resetGame()">↺ New Game</button>

<footer>
  Hosted with ❤️ &nbsp;·&nbsp; <a href="https://ko-fi.com" target="_blank">Support this game ☕</a>
</footer>

<script>
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, current, over, mode = '2p';
  let scores = { X: 0, O: 0, D: 0 };

  function setMode(m) {
    mode = m;
    document.getElementById('btn-2p').className = 'mode-btn' + (m === '2p' ? ' active' : '');
    document.getElementById('btn-ai').className = 'mode-btn' + (m === 'ai' ? ' active' : '');
    resetGame();
  }

  function resetGame() {
    board = Array(9).fill('');
    current = 'X';
    over = false;
    render();
    setStatus('<span class="marker-x">X</span> goes first');
    if (mode === 'ai' && current === 'O') setTimeout(aiMove, 400);
  }

  function render(winCells = [], newIdx = -1) {
    const el = document.getElementById('board');
    el.innerHTML = '';
    board.forEach((v, i) => {
      const cell = document.createElement('div');
      let cls = 'cell';
      if (v) cls += ' taken ' + v.toLowerCase();
      if (winCells.includes(i)) cls += ' win';
      if (i === newIdx) cls += ' pop';
      cell.className = cls;
      cell.textContent = v;
      cell.setAttribute('aria-label', v ? v + ' placed' : 'empty cell ' + (i + 1));
      if (!v && !over) cell.onclick = () => play(i);
      el.appendChild(cell);
    });
  }

  function play(i) {
    if (board[i] || over) return;
    board[i] = current;
    const result = checkWin();
    render(result ? result.cells : [], i);
    if (result) {
      const label = mode === 'ai' && current === 'O'
        ? '🤖 AI wins!'
        : '<span class="marker-' + current.toLowerCase() + '">' + current + '</span> wins!';
      setStatus(label);
      scores[current]++; updateScores(); over = true; return;
    }
    if (board.every(c => c)) {
      setStatus("It's a draw");
      scores.D++; updateScores(); over = true; render([], i); return;
    }
    current = current === 'X' ? 'O' : 'X';
    const next = mode === 'ai' && current === 'O'
      ? '🤖 AI is thinking…'
      : '<span class="marker-' + current.toLowerCase() + '">' + current + '</span>\'s turn';
    setStatus(next);
    if (mode === 'ai' && current === 'O' && !over) setTimeout(aiMove, 380);
  }

  function checkWin() {
    for (const [a, b, c] of wins) {
      if (board[a] && board[a] === board[b] && board[b] === board[c])
        return { cells: [a, b, c] };
    }
    return null;
  }

  function aiMove() {
    const best = minimax([...board], 'O', 0);
    play(best.idx);
  }

  function minimax(b, player, depth) {
    const w = checkWinOn(b);
    if (w === 'O') return { score: 10 - depth };
    if (w === 'X') return { score: depth - 10 };
    const empty = b.reduce((a, v, i) => (v ? a : [...a, i]), []);
    if (!empty.length) return { score: 0 };
    const moves = empty.map(i => {
      const nb = [...b]; nb[i] = player;
      return { idx: i, score: minimax(nb, player === 'O' ? 'X' : 'O', depth + 1).score };
    });
    return player === 'O'
      ? moves.reduce((a, b) => b.score > a.score ? b : a)
      : moves.reduce((a, b) => b.score < a.score ? b : a);
  }

  function checkWinOn(b) {
    for (const [a, c, d] of wins) {
      if (b[a] && b[a] === b[c] && b[c] === b[d]) return b[a];
    }
    return null;
  }

  function setStatus(html) { document.getElementById('status').innerHTML = html; }

  function updateScores() {
    document.getElementById('sx').textContent = scores.X;
    document.getElementById('so').textContent = scores.O;
    document.getElementById('sd').textContent = scores.D;
  }

  resetGame();
</script>
</body>
</html>
