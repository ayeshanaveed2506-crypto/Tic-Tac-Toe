<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — GridZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #1a0a2e;
    --bg2:   #231040;
    --bg3:   #2c1654;
    --neon-yellow: #f9e94e;
    --neon-pink:   #ff4fa3;
    --neon-cyan:   #3ff5d4;
    --red:    #ff3a3a;
    --yellow: #ffe033;
    --red-glow:    rgba(255,58,58,0.7);
    --yellow-glow: rgba(255,224,51,0.7);
    --text:  #f0e8ff;
    --muted: #9b87c0;
  }
  html,body { height:100%; }
  body {
    font-family:'Nunito',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(180,130,255,0.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(180,130,255,0.05) 1px,transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  #laser-bg { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.45; }
  #particle-canvas { position:fixed; inset:0; pointer-events:none; z-index:20; }

  nav {
    position:relative; z-index:10; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.1rem 2.5rem;
    border-bottom:1px solid rgba(180,130,255,0.18);
    background:rgba(26,10,46,0.75); backdrop-filter:blur(8px);
  }
  .logo { font-family:'Boogaloo',cursive; font-size:1.7rem; color:var(--neon-yellow); text-shadow:0 0 20px rgba(249,233,78,0.5); text-decoration:none; }
  .logo span { color:var(--neon-pink); }
  .back-link { font-size:0.82rem; font-weight:700; color:var(--muted); text-decoration:none; transition:color 0.15s; }
  .back-link:hover { color:var(--neon-cyan); }

  main {
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    padding:1.5rem 1rem 2.5rem; width:100%; max-width:560px;
  }

  .game-title {
    font-family:'Boogaloo',cursive; font-size:2.5rem; color:var(--text); text-align:center;
    margin-bottom:0.1rem;
    text-shadow: 0 0 20px rgba(255,58,58,0.5), 0 0 40px rgba(255,224,51,0.3);
  }
  .game-subtitle { font-size:0.78rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:1rem; }

  /* mode toggle */
  .mode-toggle {
    display:flex; background:var(--bg2);
    border:1px solid rgba(180,130,255,0.2); border-radius:50px;
    padding:4px; gap:4px; margin-bottom:1rem;
  }
  .mode-btn {
    font-family:'Nunito',sans-serif; font-size:0.82rem; font-weight:700;
    letter-spacing:0.04em; padding:8px 22px; border-radius:50px;
    border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all 0.15s;
  }
  .mode-btn.active { background:var(--neon-yellow); color:var(--bg); box-shadow:0 0 14px rgba(249,233,78,0.4); }

  /* player indicators */
  .players-row {
    display:flex; gap:12px; width:100%; margin-bottom:1rem; justify-content:center;
  }
  .player-card {
    flex:1; max-width:180px; background:var(--bg2);
    border:2px solid rgba(180,130,255,0.12); border-radius:14px;
    padding:10px 14px; display:flex; align-items:center; gap:10px;
    transition:border-color 0.25s, box-shadow 0.25s;
  }
  .player-card.active-p { border-color:var(--card-color); box-shadow:0 0 20px var(--card-glow); }
  .player-card.red-card  { --card-color:var(--red);    --card-glow:rgba(255,58,58,0.3); }
  .player-card.yellow-card { --card-color:var(--yellow); --card-glow:rgba(255,224,51,0.3); }
  .disc-preview {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    box-shadow:0 0 10px var(--card-glow);
  }
  .red-card    .disc-preview { background:radial-gradient(circle at 35% 35%,#ff8a8a,var(--red)); box-shadow:0 0 12px rgba(255,58,58,0.6); }
  .yellow-card .disc-preview { background:radial-gradient(circle at 35% 35%,#fff9a0,var(--yellow)); box-shadow:0 0 12px rgba(255,224,51,0.6); }
  .player-info { display:flex; flex-direction:column; }
  .player-name { font-family:'Boogaloo',cursive; font-size:1rem; color:var(--text); }
  .player-wins { font-size:0.7rem; color:var(--muted); letter-spacing:0.05em; }

  /* status */
  .status-wrap { margin-bottom:0.75rem; text-align:center; min-height:2rem; display:flex; align-items:center; justify-content:center; }
  .status { font-family:'Boogaloo',cursive; font-size:1.3rem; color:var(--text); }
  .status .red-t    { color:var(--red);    text-shadow:0 0 14px rgba(255,58,58,0.7); }
  .status .yellow-t { color:var(--yellow); text-shadow:0 0 14px rgba(255,224,51,0.7); }

  /* board wrapper */
  .board-outer {
    position:relative; width:100%; max-width:500px; margin-bottom:1rem;
  }

  /* column hover arrows */
  .col-arrows {
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:4px; margin-bottom:4px; width:100%;
  }
  .col-arrow {
    font-size:1.1rem; text-align:center; color:transparent;
    cursor:pointer; border-radius:8px; padding:2px 0;
    transition:color 0.15s, text-shadow 0.15s;
    height:24px; line-height:24px; user-select:none;
  }
  .col-arrow.hovered-red    { color:var(--red);    text-shadow:0 0 10px rgba(255,58,58,0.8); }
  .col-arrow.hovered-yellow { color:var(--yellow); text-shadow:0 0 10px rgba(255,224,51,0.8); }

  /* board canvas */
  #board-canvas {
    width:100%; display:block; border-radius:16px;
    border:2px solid rgba(180,130,255,0.2);
    box-shadow:0 0 40px rgba(255,58,58,0.08), 0 0 60px rgba(255,224,51,0.05);
    cursor:pointer;
  }

  /* sound + reset row */
  .bottom-row { display:flex; align-items:center; gap:16px; margin-top:0.5rem; }
  .sound-toggle { display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .sound-pill {
    width:38px; height:20px; background:var(--bg3);
    border-radius:50px; border:1px solid rgba(180,130,255,0.25); position:relative; transition:background 0.2s;
  }
  .sound-pill::after {
    content:''; position:absolute; top:3px; left:3px;
    width:12px; height:12px; border-radius:50%; background:var(--muted); transition:all 0.2s;
  }
  .sound-toggle.on .sound-pill { background:rgba(63,245,212,0.2); border-color:var(--neon-cyan); }
  .sound-toggle.on .sound-pill::after { left:21px; background:var(--neon-cyan); box-shadow:0 0 7px var(--neon-cyan); }
  .sound-label { font-size:0.75rem; font-weight:700; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
  .sound-toggle.on .sound-label { color:var(--neon-cyan); }
  .reset-btn {
    font-family:'Boogaloo',cursive; font-size:1rem; padding:9px 28px;
    border-radius:50px; border:1.5px solid rgba(249,233,78,0.35);
    background:transparent; color:var(--neon-yellow); cursor:pointer; transition:all 0.15s;
  }
  .reset-btn:hover { background:var(--neon-yellow); color:var(--bg); box-shadow:0 0 20px rgba(249,233,78,0.35); }

  footer {
    position:relative; z-index:1; margin-top:auto; padding:1.25rem;
    text-align:center; font-size:0.78rem; color:var(--muted);
    border-top:1px solid rgba(180,130,255,0.1); width:100%;
    background:rgba(26,10,46,0.6); backdrop-filter:blur(4px);
  }
  footer a { color:var(--neon-pink); text-decoration:none; }
  @media(max-width:400px){ nav{padding:1rem 1.25rem;} }
</style>

<body>
<canvas id="laser-bg"></canvas>
<canvas id="particle-canvas"></canvas>

<nav>
  <a href="index.html" class="logo">Grid<span>Zone</span></a>
  <a href="index.html" class="back-link">← All Games</a>
</nav>

<main>
  <h1 class="game-title">Connect Four</h1>
  <p class="game-subtitle">Drop · Connect · Dominate</p>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-2p" onclick="setMode('2p')">👥 2 Players</button>
    <button class="mode-btn" id="btn-ai" onclick="setMode('ai')">🤖 vs AI</button>
  </div>

  <div class="players-row">
    <div class="player-card red-card active-p" id="card-red">
      <div class="disc-preview"></div>
      <div class="player-info">
        <div class="player-name" id="name-red">Player 1</div>
        <div class="player-wins">Wins: <span id="wins-red">0</span></div>
      </div>
    </div>
    <div class="player-card yellow-card" id="card-yellow">
      <div class="disc-preview"></div>
      <div class="player-info">
        <div class="player-name" id="name-yellow">Player 2</div>
        <div class="player-wins">Wins: <span id="wins-yellow">0</span></div>
      </div>
    </div>
  </div>

  <div class="status-wrap">
    <div class="status" id="status"><span class="red-t">Red</span> goes first!</div>
  </div>

  <div class="board-outer">
    <div class="col-arrows" id="col-arrows"></div>
    <canvas id="board-canvas" width="500" height="430"></canvas>
  </div>

  <div class="bottom-row">
    <div class="sound-toggle on" id="soundToggle" onclick="toggleSound()">
      <div class="sound-pill"></div>
      <span class="sound-label">🔊 Sound</span>
    </div>
    <button class="reset-btn" onclick="resetGame()">↺ New Game</button>
  </div>
</main>

<footer>
  <p>Part of <a href="index.html">GridZone</a> · Free games forever · <a href="https://ko-fi.com" target="_blank">Support us ☕</a></p>
</footer>

<script>
// ===================== LASER BG =====================
const bgC=document.getElementById('laser-bg'),bgX=bgC.getContext('2d');
let BW,BH;
function rBg(){BW=bgC.width=window.innerWidth;BH=bgC.height=window.innerHeight;}
rBg();window.addEventListener('resize',rBg);
const LC=['rgba(255,58,58,','rgba(255,224,51,','rgba(180,100,255,','rgba(63,245,212,','rgba(255,79,163,'];
const LAS=Array.from({length:7},(_,i)=>({
  oCX:Math.random()*window.innerWidth,oCY:Math.random()*window.innerHeight,
  oR:80+Math.random()*200,oA:Math.random()*Math.PI*2,oS:(Math.random()-0.5)*0.007,
  ang:Math.random()*Math.PI*2,spd:0.003+Math.random()*0.004,
  len:150+Math.random()*260,col:LC[i%LC.length],
  alp:0.15+Math.random()*0.2,wid:1+Math.random()*1.5,
}));
function drawBg(){
  bgX.clearRect(0,0,BW,BH);
  LAS.forEach(l=>{
    l.oA+=l.oS;l.ang+=l.spd;
    const x=l.oCX+Math.cos(l.oA)*l.oR,y=l.oCY+Math.sin(l.oA)*l.oR;
    const dx=Math.cos(l.ang)*l.len,dy=Math.sin(l.ang)*l.len;
    const g=bgX.createLinearGradient(x,y,x+dx,y+dy);
    g.addColorStop(0,l.col+'0)');g.addColorStop(0.4,l.col+l.alp+')');
    g.addColorStop(0.6,l.col+l.alp+')');g.addColorStop(1,l.col+'0)');
    bgX.beginPath();bgX.moveTo(x,y);bgX.lineTo(x+dx,y+dy);
    bgX.strokeStyle=g;bgX.lineWidth=l.wid;
    bgX.shadowColor=l.col+'0.7)';bgX.shadowBlur=8;bgX.stroke();bgX.shadowBlur=0;
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// ===================== PARTICLES =====================
const pC=document.getElementById('particle-canvas'),pX=pC.getContext('2d');
function rP(){pC.width=window.innerWidth;pC.height=window.innerHeight;}
rP();window.addEventListener('resize',rP);
let parts=[],pRun=false;
function spawnP(x,y,color,n=28){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+Math.random()*0.5,s=2.5+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:1,sz:1.5+Math.random()*3,color,decay:0.025+Math.random()*0.02,laser:Math.random()>0.45});
  }
  if(!pRun){pRun=true;animP();}
}
function animP(){
  pX.clearRect(0,0,pC.width,pC.height);
  parts=parts.filter(p=>p.alpha>0.02);
  if(!parts.length){pRun=false;return;}
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.alpha-=p.decay;
    pX.globalAlpha=p.alpha;
    if(p.laser){
      const g=pX.createLinearGradient(p.x,p.y,p.x-p.vx*3,p.y-p.vy*3);
      g.addColorStop(0,p.color);g.addColorStop(1,'transparent');
      pX.beginPath();pX.moveTo(p.x,p.y);pX.lineTo(p.x-p.vx*3,p.y-p.vy*3);
      pX.strokeStyle=g;pX.lineWidth=p.sz*0.7;
      pX.shadowColor=p.color;pX.shadowBlur=6;pX.stroke();pX.shadowBlur=0;
    } else {
      pX.beginPath();pX.arc(p.x,p.y,p.sz,0,Math.PI*2);
      pX.fillStyle=p.color;pX.shadowColor=p.color;pX.shadowBlur=8;pX.fill();pX.shadowBlur=0;
    }
  });
  pX.globalAlpha=1;requestAnimationFrame(animP);
}

// ===================== AUDIO =====================
const AC=new(window.AudioContext||window.webkitAudioContext)();
let soundOn=true;
function tone(freq,type,dur,vol=0.25,delay=0){
  if(!soundOn)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime+delay);
    g.gain.setValueAtTime(vol,AC.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
    o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur);
  }catch(e){}
}
function sfxDrop(isRed){ tone(isRed?320:400,'sine',0.1,0.22); tone(isRed?480:600,'sine',0.07,0.12,0.07); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.22,0.28,i*0.1)); }
function sfxDraw(){ tone(400,'sine',0.15,0.18);tone(300,'sine',0.15,0.18,0.15);tone(220,'sine',0.2,0.18,0.3); }
function resumeAC(){ if(AC.state==='suspended')AC.resume(); }
function toggleSound(){
  resumeAC();soundOn=!soundOn;
  const el=document.getElementById('soundToggle');
  el.className='sound-toggle'+(soundOn?' on':'');
  el.querySelector('.sound-label').textContent=soundOn?'🔊 Sound':'🔇 Sound';
}

// ===================== GAME =====================
const COLS=7,ROWS=6;
const canvas=document.getElementById('board-canvas');
const ctx=canvas.getContext('2d');
const CW=canvas.width,CH=canvas.height;
const CELL=Math.min(CW/COLS, CH/ROWS);
const PAD=(CW-CELL*COLS)/2;
const VPAD=(CH-CELL*ROWS)/2;

let board,current,gameOver,mode='2p',wins={red:0,yellow:0};
let animating=false;
// dropping animation state
let dropAnim=null;
let hoverCol=-1;

// build col arrows
const arrowsEl=document.getElementById('col-arrows');
for(let c=0;c<COLS;c++){
  const d=document.createElement('div');
  d.className='col-arrow';d.textContent='▼';d.dataset.col=c;
  d.onmouseenter=()=>{if(!gameOver&&!animating)hoverCol=c;};
  d.onmouseleave=()=>{hoverCol=-1;};
  d.onclick=()=>{ resumeAC(); tryDrop(c); };
  arrowsEl.appendChild(d);
}

function updateArrows(){
  document.querySelectorAll('.col-arrow').forEach((el,c)=>{
    el.className='col-arrow'+(c===hoverCol?(current===1?' hovered-red':' hovered-yellow'):'');
  });
}

function setMode(m){
  resumeAC();mode=m;
  document.getElementById('btn-2p').className='mode-btn'+(m==='2p'?' active':'');
  document.getElementById('btn-ai').className='mode-btn'+(m==='ai'?' active':'');
  document.getElementById('name-yellow').textContent=m==='ai'?'AI':'Player 2';
  resetGame();
}

function resetGame(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  current=1;gameOver=false;animating=false;dropAnim=null;hoverCol=-1;
  updatePlayerCards();
  setStatus('<span class="red-t">Red</span> goes first!');
  drawBoard();
}

function updatePlayerCards(){
  document.getElementById('card-red').className='player-card red-card'+(current===1?' active-p':'');
  document.getElementById('card-yellow').className='player-card yellow-card'+(current===2?' active-p':'');
  document.getElementById('wins-red').textContent=wins.red;
  document.getElementById('wins-yellow').textContent=wins.yellow;
}

function setStatus(html){ document.getElementById('status').innerHTML=html; }

function tryDrop(col){
  if(gameOver||animating)return;
  const row=getDropRow(col);
  if(row===-1)return;
  animating=true;
  sfxDrop(current===1);

  // animate disc falling
  const targetY=VPAD+row*CELL+CELL/2;
  const startY=-CELL;
  const discColor=current===1?'#ff3a3a':'#ffe033';
  let curY=startY;
  const speed=18;

  function fall(){
    curY=Math.min(curY+speed+(targetY-curY)*0.18, targetY);
    drawBoard();
    // draw falling disc
    drawDisc(PAD+col*CELL+CELL/2, curY, CELL*0.42, current===1?'red':'yellow', true);
    if(curY<targetY-1){ requestAnimationFrame(fall); }
    else {
      board[row][col]=current;
      const wins4=checkWin(row,col);
      drawBoard(wins4);
      if(wins4){
        animating=false;
        setTimeout(()=>{ sfxWin(); celebrateWin(wins4,row,col); },80);
        return;
      }
      if(board[0].every((_,c)=>board[0][c]!==0)){
        animating=false;
        setTimeout(sfxDraw,80);
        setStatus("It's a draw! 🤝");
        gameOver=true; return;
      }
      current=current===1?2:1;
      updatePlayerCards();
      const name=current===1?'<span class="red-t">Red</span>':'<span class="yellow-t">Yellow</span>';
      if(mode==='ai'&&current===2){
        setStatus('🤖 AI is thinking...');
        setTimeout(aiMove,420);
      } else {
        setStatus(name+"'s turn");
      }
      animating=false;
    }
  }
  fall();
}

function celebrateWin(cells,row,col){
  const cr=canvas.getBoundingClientRect();
  cells.forEach(([r,c])=>{
    const wx=cr.left+PAD+c*CELL+CELL/2;
    const wy=cr.top+VPAD+r*CELL+CELL/2;
    spawnP(wx,wy,current===1?'#ff3a3a':'#ffe033',24);
  });
  const name=current===1?'<span class="red-t">Red</span>':'<span class="yellow-t">Yellow</span>';
  const isAI=mode==='ai'&&current===2;
  setStatus(isAI?'🤖 AI wins! Try again?':name+' wins! 🎉');
  wins[current===1?'red':'yellow']++;
  updatePlayerCards();
  gameOver=true;
}

function getDropRow(col){
  for(let r=ROWS-1;r>=0;r--){ if(board[r][col]===0)return r; }
  return -1;
}

function checkWin(row,col){
  const p=current;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let cells=[[row,col]];
    for(let d=1;d<4;d++){
      const nr=row+dr*d,nc=col+dc*d;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===p)cells.push([nr,nc]);
      else break;
    }
    for(let d=1;d<4;d++){
      const nr=row-dr*d,nc=col-dc*d;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===p)cells.push([nr,nc]);
      else break;
    }
    if(cells.length>=4)return cells.slice(0,4);
  }
  return null;
}

// ===================== DRAWING =====================
function drawDisc(x,y,r,player,floating=false){
  const isRed=player==='red'||player===1;
  const base=isRed?'#ff3a3a':'#ffe033';
  const light=isRed?'#ff8a8a':'#fff9a0';
  const glow=isRed?'rgba(255,58,58,':'rgba(255,224,51,';

  ctx.save();
  // outer glow
  ctx.shadowColor=base;
  ctx.shadowBlur=floating?20:14;
  // base circle
  const grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.05,x,y,r);
  grad.addColorStop(0,light);
  grad.addColorStop(0.45,base);
  grad.addColorStop(1, isRed?'#990000':'#aa8800');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();

  // inner highlight
  ctx.shadowBlur=0;
  const shine=ctx.createRadialGradient(x-r*0.28,y-r*0.28,0,x-r*0.1,y-r*0.1,r*0.55);
  shine.addColorStop(0,'rgba(255,255,255,0.55)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=shine;ctx.fill();

  // rim
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle=isRed?'rgba(255,160,160,0.4)':'rgba(255,255,180,0.4)';
  ctx.lineWidth=1.5;ctx.stroke();

  // laser ring pulse
  if(!floating){
    ctx.beginPath();ctx.arc(x,y,r+2,0,Math.PI*2);
    ctx.strokeStyle=glow+'0.15)';ctx.lineWidth=3;ctx.stroke();
  }
  ctx.restore();
}

function drawBoard(winCells=null){
  ctx.clearRect(0,0,CW,CH);

  // board bg
  const boardGrad=ctx.createLinearGradient(0,0,0,CH);
  boardGrad.addColorStop(0,'#18083a');boardGrad.addColorStop(1,'#0e0520');
  ctx.fillStyle=boardGrad;
  ctx.beginPath();ctx.roundRect(0,0,CW,CH,16);ctx.fill();

  // subtle column highlight on hover
  if(hoverCol>=0&&!gameOver&&!animating){
    ctx.fillStyle=current===1?'rgba(255,58,58,0.05)':'rgba(255,224,51,0.05)';
    ctx.fillRect(PAD+hoverCol*CELL,0,CELL,CH);
  }

  // draw placed discs
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(board[r][c]===0) continue;
      const x=PAD+c*CELL+CELL/2, y=VPAD+r*CELL+CELL/2;
      const isWin=winCells&&winCells.some(([wr,wc])=>wr===r&&wc===c);
      if(isWin){
        // pulsing win glow
        ctx.save();
        ctx.shadowColor=board[r][c]===1?'#ff3a3a':'#ffe033';
        ctx.shadowBlur=30;
        drawDisc(x,y,CELL*0.44,board[r][c]===1?'red':'yellow');
        ctx.restore();
      } else {
        drawDisc(x,y,CELL*0.42,board[r][c]===1?'red':'yellow');
      }
    }
  }

  // draw board holes grid overlay
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(board[r][c]!==0)continue;
      const x=PAD+c*CELL+CELL/2, y=VPAD+r*CELL+CELL/2, rad=CELL*0.42;
      // empty hole
      ctx.save();
      ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);
      ctx.fillStyle='rgba(10,4,22,0.85)';ctx.fill();
      // subtle ring
      ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);
      ctx.strokeStyle='rgba(180,130,255,0.12)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    }
  }

  // win line laser
  if(winCells&&winCells.length>=4){
    const color=current===1?'#ff3a3a':'#ffe033';
    const [r0,c0]=winCells[0],[r3,c3]=winCells[3];
    const x0=PAD+c0*CELL+CELL/2,y0=VPAD+r0*CELL+CELL/2;
    const x3=PAD+c3*CELL+CELL/2,y3=VPAD+r3*CELL+CELL/2;
    [10,5,2].forEach((w,i)=>{
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x3,y3);
      ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
      ctx.globalAlpha=i===0?0.2:i===1?0.4:1;
      ctx.shadowColor=color;ctx.shadowBlur=i===2?16:0;
      ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;
    });
  }

  updateArrows();
}

// ===================== AI =====================
function aiMove(){
  // Try to win, block, or pick best column
  const col=getBestCol();
  tryDrop(col);
}

function getBestCol(){
  // 1. win
  for(let c=0;c<COLS;c++){
    const r=getDropRow(c);if(r===-1)continue;
    board[r][c]=2;const w=checkWin(r,c);board[r][c]=0;
    if(w)return c;
  }
  // 2. block player 1 win
  const origCurrent=current;current=1;
  for(let c=0;c<COLS;c++){
    const r=getDropRow(c);if(r===-1)continue;
    board[r][c]=1;const w=checkWin(r,c);board[r][c]=0;
    if(w){current=origCurrent;return c;}
  }
  current=origCurrent;
  // 3. score columns
  const scores=Array(COLS).fill(0);
  const centerCols=[3,2,4,1,5,0,6];
  centerCols.forEach((c,i)=>scores[c]+=6-i);
  // check 3-in-a-row threats
  for(let c=0;c<COLS;c++){
    const r=getDropRow(c);if(r===-1){scores[c]=-999;continue;}
    board[r][c]=2;scores[c]+=countThreats(r,c,2)*4;board[r][c]=0;
    board[r][c]=1;scores[c]-=countThreats(r,c,1)*3;board[r][c]=0;
  }
  let best=Math.max(...scores);
  const candidates=scores.map((s,i)=>s===best?i:-1).filter(i=>i>=0);
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function countThreats(row,col,player){
  let count=0;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let len=1;
    for(let d=1;d<4;d++){const nr=row+dr*d,nc=col+dc*d;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player)len++;else break;}
    for(let d=1;d<4;d++){const nr=row-dr*d,nc=col-dc*d;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player)len++;else break;}
    if(len>=3)count++;
  }
  return count;
}

// ===================== MOUSE/TOUCH =====================
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const col=Math.floor((x-PAD)/CELL);
  hoverCol=(col>=0&&col<COLS)?col:-1;
  drawBoard();
});
canvas.addEventListener('mouseleave',()=>{ hoverCol=-1; drawBoard(); });
canvas.addEventListener('click',e=>{
  resumeAC();
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const col=Math.floor((x-PAD)/CELL);
  if(col>=0&&col<COLS)tryDrop(col);
});
canvas.addEventListener('touchend',e=>{
  resumeAC();
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const x=e.changedTouches[0].clientX-rect.left;
  const col=Math.floor((x-PAD)/CELL);
  if(col>=0&&col<COLS)tryDrop(col);
},{passive:false});

// animate empty board on load + loop for laser pulse
function animLoop(){ drawBoard(); requestAnimationFrame(animLoop); }
animLoop();

resetGame();
</script>
